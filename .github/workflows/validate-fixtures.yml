name: Validate fixtures

# edge is the fast/low-ceremony integration branch (see CONTRIBUTING.md);
# main is kept stable for the planner team. dev is retired.
on:
  push:
    branches: [ "main", "edge" ]
  pull_request:
    branches: [ "main", "edge" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate against the exported schemas
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    # The interchange models (and scripts/export_schema.py) live in this repo
    # now (robust-rail-generator#14) — the schema is direct build output, not
    # a copy of anything, so there's nothing left to clone or go stale
    # against a branch-name guess the way this used to work.
    #
    # Still gating: a stale schema/ turns every check below into a check of
    # the wrong contract, and it would pass while doing so.
    - name: Check the exported schemas are not stale
      run: |
        uv run --frozen python scripts/export_schema.py
        git diff --exit-code schema/ \
          || { echo "::error::schema/ is stale — re-export and commit it before trusting this run"; exit 1; }

    # Gating since 2026-08-08, when the last of the drift was cleared and every
    # fixture validated. It ran report-only before that, at 2 of 18, on the
    # reasoning that a permanently red check teaches everyone to ignore it — and
    # it promptly did exactly that, staying green through a run that measured
    # the fixtures against the wrong schema and said so only in the log.
    #
    # scenario_config_*.json is deliberately not covered: it has no schema, and
    # check_config.py's tolerance of unknown keys is what lets the
    # configurations carry their "intent" blocks.
    - name: Validate the fixtures
      run: |
        uv run --with jsonschema python validate_json.py --schema-dir schema
