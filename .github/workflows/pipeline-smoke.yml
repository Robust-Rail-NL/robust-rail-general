name: Pipeline smoke test

# main and edge (see CONTRIBUTING.md for the edge branch). dev is retired —
# it predated the unified-format pipeline run_*.py now requires.
on:
  push:
    branches: [ "main", "edge" ]
  pull_request:
    branches: [ "main", "edge" ]
  workflow_dispatch:

jobs:
  pipeline-smoke:
    runs-on: ubuntu-latest
    name: Run generator → solver → evaluator against one cheap fixture
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Location_SimpleService is the cheapest fixture in the corpus (one
    # config, one scenario, one plan). This exercises the real published
    # Docker images end to end — generator, solver, evaluator — catching
    # runtime failures (crashes, an incompatible --config schema) that
    # validate-fixtures.yml's static JSON Schema check can't see. All three
    # images are public on ghcr.io, so no registry auth is needed.
    - name: Run the pipeline against Location_SimpleService
      run: python3 run_pipeline.py --location Location_SimpleService --version stable

    - name: Show solver/evaluator output on failure
      if: failure()
      run: |
        for f in Location_SimpleService/plans/*.out Location_SimpleService/plans/*.err \
                 Location_SimpleService/evaluations/*.out Location_SimpleService/evaluations/*.err; do
          [ -f "$f" ] || continue
          echo "=== $f ==="
          cat "$f"
        done
