[project]
# Dist name matches the repo (referenced from the generator's dependency
# declaration); the importable package is robust_rail_models/ at the repo
# root. Decided in robust-rail-generator#14 — see docs/roadmap-2.0.0.md,
# "Where the exported schemas should live".
name = "robust-rail-general"
version = "0.1.1"
description = "Interchange schema (Location/Scenario/Plan) shared by the Robust Rail NL pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This repo is more than the models package: run_*.py, scripts/, Location_*/
# fixtures, docs/, etc. all sit at the repo root beside it. Only
# robust_rail_models/ ships in the wheel — everything else stays out of what
# a dependent actually installs.
[tool.hatch.build.targets.wheel]
packages = ["robust_rail_models"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# sys.path must be extended before the src-relative imports below it.
"scripts/export_schema.py" = ["E402"]
